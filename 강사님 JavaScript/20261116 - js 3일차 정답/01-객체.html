<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const user = {
      name: 'Alice',
      'key with space': true,
      greeting: function () {
        return 'hello'
      }
    }

    // 조회 두가지 방법
    // 1. 객체.속성
    console.log(user.name)

    // 2. 근데 만약 속성이 문자열, 특수문자포함, 숫자로시작
    // 2. 객체['속성']
    console.log(user['key with space'])


    // 추가 -> 객체.속성
    user.address = 'busan'
    console.log(user.address)
    console.log(user)

    // 수정 -> 객체.속성
    user.name = 'bogeom'
    console.log(user.name)


    // 삭제 -> delete
    delete user.address
    console.log(user.address) // undefined


    // in 연산자 (파이썬의 맴버쉽 연산자와 비슷하다)
    console.log('greeting' in user)
    console.log('county' in user)
 

    // 메서드 호출 (객체 안에 함수)
    console.log(user.greeting())



  </script>
</body>

</html>
