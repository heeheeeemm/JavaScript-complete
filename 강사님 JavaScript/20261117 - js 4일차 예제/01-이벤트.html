
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button id="btn">버튼</button>

  <script>
    // 1. 버튼 선택 -> querySelector
    const btn = document.querySelector('#btn')

    // 2. 콜백 함수
    const detectClick = function (event) {
      console.log(event)
      console.log(event.currentTarget)  // 버튼 요소
      console.log(this)  // 버튼 요소
    }


    // 3. 버튼에 이벤트 핸들러를 부착
    // 이벤트리스너 : 어떤 특정 이벤트를 감지했을 때 특정 함수를 실행하겠다.
    // ex) btn(버튼)을 클릭했을 때 detectClick함수를 실행하겠다.
    btn.addEventListener('click',detectClick)


  </script>
</body>

</html>
