<!-- async_await.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    /*
    then을 계속 이어 쓰면 코드가 길어지고, 흐름을 따라가기 어렵다.
    비동기 코드를 위에서 아래로 읽히게 쓰고 싶다. => async / await

    async
    - 함수 앞에 작성
    - 함수 내부에서 await 키워드를 사용할 수 있게 해줌 (주된 이유)
    - async 함수는 항상 Promise 객체를 반환

    await
    - Promise 앞에 작성
    - Promise가 완료될 때까지 "async 함수 안의 코드"만 잠시 멈추고, 결과값을 돌려줌
      (브라우저 전체가 멈추는 것은 아님. 함수 밖의 코드는 계속 실행됨)
    - await 뒤의 값이 Promise가 아니면 그 값을 그대로 돌려줌
    - async 함수 안에서만 사용할 수 있음
    */

    // promise.html과 같은 함수 (1초 뒤 50% 확률로 성공 또는 실패)
    const getRandomData = function () {
      return new Promise((resolve, reject) => {
        const success = Math.random() > 0.5

        setTimeout(() => {
          if (success) {
            resolve('데이터 도착!')
          } else {
            reject('에러 발생!')
          }
        }, 1000)
      })
    }

    // promise.html의 "3번 연속 호출"을 async/await로 바꾼 버전
    const main = async function () {
      try {
        const data1 = await getRandomData() // 결과가 올 때까지 이 줄에서 대기
        console.log('1번째 성공:', data1)
        const data2 = await getRandomData()
        console.log('2번째 성공:', data2)
        const data3 = await getRandomData()
        console.log('3번째 성공:', data3)

        // 참고: 반복문과도 함께 사용할 수 있음
        // for (let i = 1; i <= 3; i++) {
        //   const data = await getRandomData()
        //   console.log(`${i}번째 성공:`, data)
        // }
      } catch (error) {
        // try 안의 await 중 하나라도 실패하면 바로 여기로 이동 (then 방식의 catch와 같은 역할)
        console.log('중간에 실패함:', error)
      }
    }

    main()

    // main 안의 await는 main 함수 안쪽만 멈추게 함
    // 그래서 이 줄은 main의 결과를 기다리지 않고 가장 먼저 출력됨
    console.log('main 호출 직후')

    // 참고: 일반 <script>의 최상단(함수 밖)에서는 await를 쓸 수 없음 (SyntaxError)
  </script>
</body>

</html>
