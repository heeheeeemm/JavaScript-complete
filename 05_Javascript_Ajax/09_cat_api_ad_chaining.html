<!-- cat_api_ad_chaining.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <button>냥냥펀치</button>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script>
    // then chaining
    // - 첫 번째 then에서 return한 값이 다음 then의 인자로 전달됨
    // - 단계별로 할 일을 나누어 쓰고, 에러는 마지막 catch 하나에서 처리
    const API_URL = 'https://api.thecatapi.com/v1/images/search'
    const btn = document.querySelector('button')

    const getCats = function () {
      axios({
        method: 'get',
        url: API_URL
      })
        // 1. 응답에서 이미지 주소만 꺼내 다음 단계로 전달
        .then((response) => {
          const imgUrl = response.data[0].url
          return imgUrl
        })
        // 2. 전달받은 주소로 img 요소를 만들어 화면에 추가
        .then((imgData) => {
          const imgElem = document.createElement('img')
          imgElem.setAttribute('src', imgData)
          document.body.appendChild(imgElem)
        })
        // 3. 위 단계 중 어디서든 실패하면 남은 then을 건너뛰고 여기로 이동
        .catch((error) => {
          console.log(error)
          console.log('실패했다옹')
        })
      console.log('야옹야옹') // 응답을 기다리지 않으므로 이미지보다 먼저 출력
    }

    btn.addEventListener('click', getCats)

    // => 같은 코드를 async/await로 바꾼 버전: async_await_cat_api.html
  </script>
</body>

</html>
