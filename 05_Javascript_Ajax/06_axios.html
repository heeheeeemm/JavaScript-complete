<!-- axios.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script>
    // axios: Promise 기반의 HTTP 요청 라이브러리
    // - fetch.html에서 직접 하던 JSON 변환, 실패 응답 확인을 자동으로 처리

    // 1. axios는 Promise 객체를 반환
    // - 응답을 바로 돌려주지 않고 "나중에 결과를 주겠다"는 Promise를 먼저 반환
    const promiseObj = axios({
      method: 'get',
      url: 'https://api.thecatapi.com/v1/images/search'
    })

    console.log(promiseObj) // Promise object

    // - then: 요청이 성공하면 실행 (response.data에 JSON이 이미 객체로 변환되어 있음)
    // - catch: 요청이 실패하면 실행 (404, 500 같은 실패 응답도 catch로 이동)
    promiseObj
      .then((response) => {
        console.log(response) // Response object
        console.log(response.data)  // Response data
      })
      .catch((error) => {
        console.error(error)
      })

    // // 2. 변수에 담지 않고 바로 then, catch를 이어 쓰는 형태 (실제로 더 많이 사용)
    // axios({
    //   method: 'get',
    //   url: 'https://api.thecatapi.com/v1/images/search'
    // })
    //   .then((response) => {
    //     console.log(response)
    //     console.log(response.data)
    //   })
    //   .catch((error) => {
    //     console.error(error)
    //   })
  </script>

</body>

</html>
