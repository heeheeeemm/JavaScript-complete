<!-- cat_api.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script>
    // 고양이 사진 가져오기 - 기본
    // - 응답을 기다리는 동안 다음 코드가 먼저 실행되는지 확인
    // 변수명을 URL로 지으면 브라우저 내장 URL 객체(window.URL)를 가려 axios가 동작하지 않음 -> API_URL 사용
    const API_URL = 'https://api.thecatapi.com/v1/images/search'

    axios({
      method: 'get',
      url: API_URL
    })
      .then((response) => {  // 성공한 경우
        console.log(response)
        console.log(response.data) // [{ id, url, width, height }] (배열 안에 객체 1개)
      })
      .catch((error) => {  // 실패한 경우
        console.log(error)
        console.log('실패했다옹')
      })
    console.log('야옹야옹')

    // 출력결과
    // 야옹야옹 (요청을 보낸 직후 바로 실행)
    // Response 객체, 응답 데이터 (응답이 도착한 뒤 실행)
  </script>
</body>

</html>
