<!-- array_with_spread_syntax.html -->

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 배열 복사 (with 전개 구문)
    // - ...parts 는 배열의 괄호를 벗기고 내용물만 꺼냄
    // - 항상 새로운 배열을 만들며, 원본(parts)은 바뀌지 않음
    let parts = ['어깨', '무릎']
    let lyrics = ['머리', ...parts, '발']

    console.log(lyrics) // [ '머리', '어깨', '무릎', '발' ]
  </script>
</body>

</html>
