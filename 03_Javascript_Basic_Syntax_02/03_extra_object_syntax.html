<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 단축 속성
    // - key 이름과 값으로 쓰는 변수 이름이 같으면 한 번만 작성
    const name = 'Alice'
    const age = 30

    // 단축 속성 전
    // const user = {
    //   name: name,
    //   age: age
    // }

    // 단축 속성 후
    const user = {
      name, age
    }
    console.log(user) // {name: 'Alice', age: 30}

    // 2. 단축 메서드
    // - 메서드를 정의할 때 function 키워드 생략

    // 단축 메서드 전
    // const myObj1 = {
    //   myFunc: function () {
    //     return 'Hello'
    //   }
    // }

    // 단축 메서드 후
    const myObj1 = {
      myFunc() {
        return 'Hello'
      }
    }
    console.log(myObj1.myFunc()) // Hello

    // 3. 계산된 속성
    // - [ ] 안의 값을 계산해서 key로 사용 (고정된 이름이 아니라 변수 값을 key로)
    // - 페이지를 열면 입력 창이 뜸 (예: '연필' 입력)
    const product = prompt('물건 이름을 입력해주세요')
    const prefix = 'my'
    const suffix = 'property'

    const bag = {
      [product]: 5,
      [prefix + suffix]: 'value'
    }

    console.log(bag) // {연필: 5, myproperty: 'value'}


    // 4. 구조 분해 할당
    // - 객체의 속성을 같은 이름의 변수로 한 번에 꺼냄
    const userInfo = {
      firstName: 'Alice',
      userId: 'alice123',
      email: 'alice123@gmail.com'
    }

    // 구조 분해 할당 전
    // const firstName = userInfo.firstName
    // const userId = userInfo.userId
    // const email = userInfo.email

    // 구조 분해 할당 후 (세 줄 중 하나만 사용, 같은 이름을 다시 선언하면 에러)
    // const { firstName } = userInfo
    // const { firstName, userId } = userInfo
    const { firstName, userId, email } = userInfo
    console.log(firstName, userId, email) // Alice alice123 alice123@gmail.com

    // 구조 분해 할당 활용 - 함수 매개변수
    // 구조 분해 할당 활용 전
    // function printInfo(userInfo) {
    //   console.log(`이름: ${userInfo.firstName}, 나이: ${userInfo.age}, 도시: ${userInfo.city}`)
    // }
    // printInfo(userInfo)

    // 구조 분해 할당 활용 후
    // - 객체를 통째로 넘기면, 매개변수 자리에서 필요한 속성만 꺼내 씀
    function printInfo({ firstName, email }) {
      console.log(`이름: ${firstName}, 이메일: ${email}`)
    }
    printInfo(userInfo) // 이름: Alice, 이메일: alice123@gmail.com

    // 5. 전개 구문
    // - 객체 안에서 다른 객체의 속성을 펼쳐 넣음 (얕은 복사)
    // - 같은 key가 있으면 뒤에 쓴 값이 앞의 값을 덮어씀
    const obj = { a: 2, c: 3, d: 4 }
    const newObj = { ...obj, a: 1, e: 5 }
    console.log(newObj) // {a: 1, c: 3, d: 4, e: 5}

    // 6. 유용한 객체 메서드
    // - key, value, [key, value] 쌍을 "배열"로 반환
    const profile = {
      name: 'Alice',
      age: 30
    }

    console.log(Object.keys(profile)) // ['name', 'age']
    console.log(Object.values(profile)) // ['Alice', 30]
    console.log(Object.entries(profile)) // [['name', 'Alice'], ['age', 30]]

    // 7. Optional Chaining
    // - ?. 앞의 대상이 null 또는 undefined이면, 에러 대신 undefined를 반환하고 평가를 멈춤
    const userData = {
      name: 'Alice',
      greeting: function () {
        return 'hello'
      }
    }

    // 예전 방식
    console.log(userData.address && userData.address.street) // undefined

    // 변수 옵셔널 체이닝
    // ※ 에러가 나면 아래 코드가 실행되지 않으므로, 에러 줄은 주석을 풀어 따로 확인
    // console.log(userData.address.street) // Uncaught TypeError: Cannot read properties of undefined (reading 'street')
    console.log(userData.address?.street) // undefined

    // 함수 옵셔널 체이닝
    // console.log(userData.nonMethod()) // Uncaught TypeError: userData.nonMethod is not a function
    console.log(userData.nonMethod?.()) // undefined


    // 주의: 존재하지 않아도 괜찮은 대상에만 사용
    // 위 예시 코드 논리상 user는 반드시 있어야 하지만 address는 필수 값이 아님
    // user에 값을 할당하지 않은 문제가 있을 때 바로 알아낼 수 있어야 하기 때문
    // Bad
    userData?.address?.street

    // Good
    userData.address?.street
  </script>
</body>

</html>
